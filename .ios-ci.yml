# DroneSim 的 CI 配置：所有工作流都从这里读设置，入口文件里只剩 uses: 和 secrets:。
# 完整说明见 ios-ci-workflows 的 docs/config.md。

# 工程（必填：project、scheme、bundle_id）
workdir: .
project: DroneSim.xcodeproj
scheme: DroneSim
bundle_id: com.qweq-1.dronesim
display_name: '无人机模拟'
generate_command: xcodegen generate && python3 Scripts/sync-test-plans.py

# 工具链：显式固定
toolchain:
  xcode: '26.6'
  simulator: iPhone 17 Pro
  ios: '26.4'

build_test:
  # 只配 fast_test_plan，不配 full_test_plan：
  # resolve-suite 在只有一份计划时会走 default 分支，跑 scheme 的全部测试
  # （目前就是 DroneSimTests 单元测试），push 到 main 也不会切到 UI 慢线。
  # 等 UI 测试 target 的加载问题解决后再补 full_test_plan 和 ui_test_target。
  fast_test_plan: Fast
  accessibility_audit: warn

testflight:
  entitlement_mode: none
  acceptance_issue: true
