name: DroneSim
options:
  bundleIdPrefix: com.qweq-1
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  DroneSim:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      # 整个目录（包含 Render/Shaders.metal）。XcodeGen 会自动把 .metal
      # 放进 Compile Sources 的 Metal 编译阶段，打包成 default.metallib。
      - path: DroneSim
    info:
      path: DroneSim/Info.plist
      properties:
        CFBundleDisplayName: "无人机模拟"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        ITSAppUsesNonExemptEncryption: false
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qweq-1.dronesim
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        MTL_FAST_MATH: "YES"

  DroneSimTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/Unit
    dependencies:
      - target: DroneSim
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qweq-1.dronesim.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DroneSim.app/DroneSim"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  DroneSim:
    build:
      targets:
        DroneSim: all
        DroneSimTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DroneSimTests
      testPlans:
        - path: Fast.xctestplan
          defaultPlan: true
        - path: Full.xctestplan
